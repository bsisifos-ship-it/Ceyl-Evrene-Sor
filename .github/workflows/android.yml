name: Ceyl Evrene Sor - Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v6

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyasını aç
        run: unzip -q CEYL_EVRENE_SOR_Sifirdan_Android_Proje.zip -d proje

      - name: Proje klasörünü bul
        run: |
          PROJECT_DIR=$(dirname "$(find proje -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java hedefini 17 yap
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PROJECT_DIR/app/build.gradle"

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Android APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: Ceyl-Evrene-Sor-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
